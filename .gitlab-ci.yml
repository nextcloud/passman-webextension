image: oven/bun:alpine

# variables:
#   BUN_VERSION: "1.0.30"

stages:
  - setup
  - build

# Cache dependencies between jobs
cache:
  key:
    files:
      - bun.lockb
      - package.json
  paths:
    - node_modules/

install:
  stage: setup
  script:
    - bun --version
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

build:
  stage: build
  needs:
    - install
  script:
    - apk add --no-cache --virtual .build-deps gcc musl-dev
    - apk add nodejs npm
    - npm install -g node-gyp
    - bun run prebuild
    - bun run build
#    - bun run build-ff
    - bun run package
#    - bun run package-ff
  artifacts:
    paths:
      - build/chrome-mv3-prod.zip
#      - build/firefox-mv2-prod.zip
    expire_in: 1 week
